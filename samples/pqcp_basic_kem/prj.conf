# PQCP Basic KEM Sample
CONFIG_PQCP=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_768=y

# RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PQCP_RNG_ZEPHYR_ENTROPY=y

# Benchmarking
CONFIG_PQCP_BENCH=y
CONFIG_PQCP_BENCH_ITERATIONS=10

# Stack for crypto operations
CONFIG_MAIN_STACK_SIZE=16384

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Timing
CONFIG_TIMING_FUNCTIONS=y
