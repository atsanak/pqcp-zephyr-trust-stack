# SPDX-License-Identifier: MIT
sample:
  name: Runtime metadata recovery
tests:
  sample.pqcp.runtime_recovery:
    platform_allow:
      - qemu_x86_64
    harness: console
    harness_config:
      type: one_line
      regex:
        - "PQCP_RUNTIME_RECOVERY status=PASS"
    tags:
      - pqcp
      - flash
