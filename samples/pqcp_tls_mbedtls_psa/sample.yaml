sample:
  name: Exporter-bound PQC channel over TLS
tests:
  sample.pqcp.tls_mbedtls_psa:
    platform_allow:
      - qemu_x86_64
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "PQCP_TLS_LOOPBACK schema=1 stage=pqc_handshake status=PASS mlkem=768 mldsa=65 authentication=pinned_server"
        - "PQCP_TLS_LOOPBACK schema=1 stage=inner_aead status=PASS"
        - "PQCP_TLS_LOOPBACK schema=1 status=PASS result=0 transport=mbedtls_tls13_psk binding=exporter_mlkem_mldsa"
    tags:
      - pqcp
      - tls
      - protected-channel
    timeout: 180
