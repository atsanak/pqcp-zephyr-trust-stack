# SPDX-License-Identifier: MIT
#
# Signed-passport profile for the deployment advisor sample.
#
# Adds the demo-custody ML-DSA-65 passport signature stage on top of the
# full evidence chain, so ONE captured device transcript carries the chain
# AND its signature. Uses the deterministic test RNG per the demo custody
# profile in docs/passport-signing-custody.md; any real deployment must use
# a hardware entropy source instead.

CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_65=y
CONFIG_PQCP_RNG_CUSTOM=n
CONFIG_PQCP_RNG_DETERMINISTIC_TEST=y
CONFIG_PQCP_DEPLOYMENT_PASSPORT_SIGNATURE=y

# ML-DSA-65 keygen/sign need substantially more stack than the chain alone.
CONFIG_MAIN_STACK_SIZE=196608
