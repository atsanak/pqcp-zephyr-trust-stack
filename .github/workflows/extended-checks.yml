name: Extended Checks

on:
  workflow_dispatch:
    inputs:
      zephyr_ref:
        description: Zephyr tag, branch, or commit to validate
        required: false
        default: v4.4.0
        type: string
      run_sanitizers:
        description: Run native_sim/native/64 ASan/UBSan checks
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 1"

env:
  ZEPHYR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.zephyr_ref || 'v4.4.0' }}
  ZEPHYR_SDK_VERSION: "1.0.1"
  WEST_UPDATE_ARGS: "--narrow"

jobs:
  static-analysis:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cppcheck \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        timeout-minutes: 30
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REF" zephyrproject
          cd zephyrproject
          west update $WEST_UPDATE_ARGS
          west packages pip --install --ignore-venv-check
          west sdk install --version "$ZEPHYR_SDK_VERSION" --gnu-toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Run extended checks
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_extended_checks.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE" \
            --zephyr-ref "$ZEPHYR_REF" \
            --run-cost-of-assurance-smoke \
            --strict

      - name: Run manual Zephyr compatibility smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.zephyr_ref != 'v4.4.0' }}
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_extended_checks.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE" \
            --zephyr-ref "$ZEPHYR_REF" \
            --skip-graphviz \
            --run-compatibility-smoke \
            --strict

      - name: Run ACVP host-driver smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          west build -p always -d build-acvp-host -b qemu_x86_64 \
            "$GITHUB_WORKSPACE/samples/pqcp_serial_acvp" \
            -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"

          python "$GITHUB_WORKSPACE/scripts/run_acvp_serial_session.py" \
            --cwd "$ZEPHYR_WORKSPACE" \
            --run-command "west build -d build-acvp-host -t run" \
            --json-out "$RUNNER_TEMP/acvp-host-smoke.json" \
            --transcript-out "$RUNNER_TEMP/acvp-host-smoke.log"

      - name: Run qemu_x86_64 profile-validation budget smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            --profile-validation \
            --board qemu_x86_64 \
            --build-only \
            --resource-budgets "$GITHUB_WORKSPACE/scripts/resource_budgets.json" \
            --output "$RUNNER_TEMP/qemu-profile-validation-budget-smoke" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

      - name: Run mps2/an385 profile-validation build smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            --profile-validation \
            --board mps2/an385 \
            --profile MCU_MINIMAL \
            --sample ztest_primitive \
            --build-only \
            --resource-budgets "$GITHUB_WORKSPACE/scripts/resource_budgets.json" \
            --output "$RUNNER_TEMP/mps2-profile-validation-smoke" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

      - name: Run nucleo_h743zi profile-validation build smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            --profile-validation \
            --board nucleo_h743zi \
            --profile MCU_MINIMAL \
            --build-only \
            --resource-budgets "$GITHUB_WORKSPACE/scripts/resource_budgets.json" \
            --output "$RUNNER_TEMP/nucleo-h743zi-profile-validation-smoke" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

      - name: Run optional native_sim sanitizer checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sanitizers }}
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_sanitizer_checks.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"
