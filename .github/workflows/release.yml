name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Tag or ref to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      RELEASE_REF: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.release_ref || github.ref_name }}
      ZEPHYR_SDK_VERSION: "1.0.1"
      WEST_UPDATE_ARGS: "--narrow"

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tagged release version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${RELEASE_REF#v}"
          VERSION="$(sed -n 's/^#define[[:space:]]\+PQCP_ZEPHYR_VERSION_STRING[[:space:]]\+"\([^"]\+\)".*/\1/p' include/pqcp_zephyr/version.h | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine PQCP_ZEPHYR_VERSION_STRING"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag ${TAG_VERSION} does not match version.h ${VERSION}"
            exit 1
          fi
          if ! grep -q "^## \\[${TAG_VERSION}\\]" CHANGELOG.md; then
            echo "No CHANGELOG entry for ${TAG_VERSION}"
            exit 1
          fi
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cppcheck \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        timeout-minutes: 30
        run: |
          west init -m "$GITHUB_WORKSPACE" --mr "$RELEASE_REF" release-workspace
          cd release-workspace
          west update $WEST_UPDATE_ARGS
          west packages pip --install --ignore-venv-check
          west sdk install --version "$ZEPHYR_SDK_VERSION" --gnu-toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"
          echo "MODULE_PATH=$PWD/pqcp-zephyr-trust-stack" >> "$GITHUB_ENV"

      - name: Run release gate
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        timeout-minutes: 90
        run: |
          set -o pipefail
          python "$MODULE_PATH/scripts/release_check.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$MODULE_PATH" \
            --output-root "$RUNNER_TEMP/release-check-output" \
            | tee "$RUNNER_TEMP/release-check.log"

      - name: Build all qemu_x86_64 samples and ztests
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail

          logs_dir="$RUNNER_TEMP/release-build-logs"
          summary="$RUNNER_TEMP/build_summary.txt"
          mkdir -p "$logs_dir"
          : > "$summary"

          # Keep this list in sync with release-dry-run.yml so the two
          # workflows exercise identical build matrices. KAT vectors are
          # also verified inside scripts/release_check.py, but having the
          # bulk-build cover tests/ztest_acvp_kat keeps release-time
          # artifacts consistent with the dry-run evidence reviewers see.
          apps=(
            "samples/pqcp_basic_kem"
            "samples/pqcp_basic_sig"
            "samples/pqcp_bench_protocol"
            "samples/pqcp_kat_deterministic"
            "samples/pqcp_serial_acvp"
            "samples/pqcp_streaming_hash_mldsa"
            "samples/pqcp_tls_mbedtls_psa"
            "tests/ztest_acvp_kat"
            "tests/ztest_acvp_serial"
            "tests/ztest_primitive"
            "tests/ztest_rng"
            "tests/ztest_tls_selftest"
          )

          for app in "${apps[@]}"; do
            name="${app//\//_}"
            build_dir="$RUNNER_TEMP/build-${name}"
            log_file="$logs_dir/${name}.log"

            echo "==> Building $app" | tee -a "$summary"
            west build -p always -d "$build_dir" -b qemu_x86_64 "$MODULE_PATH/$app" \
              -- -DZEPHYR_EXTRA_MODULES="$MODULE_PATH" >"$log_file" 2>&1
            echo "PASS $app" | tee -a "$summary"
            echo "  log: $log_file" >> "$summary"
          done

      - name: Build nucleo_h743zi protocol ELFs for release assets
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail

          # Kept in sync with .github/workflows/ci.yml::nucleo-protocol-builds
          # so release assets exactly match the MCU footprint evidence that
          # reviewers see on main. Two configurations are shipped:
          #   - default (ML-KEM-768 + ML-DSA-65)
          #   - single-level (ML-KEM-512 + ML-DSA-87)
          # Both use overlay-rtos-metrics.conf, identical to CI.
          mcu_dir="$RUNNER_TEMP/release-mcu-assets"
          mcu_logs="$RUNNER_TEMP/release-mcu-logs"
          mkdir -p "$mcu_dir" "$mcu_logs"

          west build -p always \
            -d "$RUNNER_TEMP/release-build-nucleo-default" \
            -b nucleo_h743zi \
            "$MODULE_PATH/samples/pqcp_bench_protocol" \
            -- \
            -DZEPHYR_EXTRA_MODULES="$MODULE_PATH" \
            -DOVERLAY_CONFIG=overlay-rtos-metrics.conf \
            >"$mcu_logs/mlkem768_mldsa65.log" 2>&1

          west build -p always \
            -d "$RUNNER_TEMP/release-build-nucleo-single-level" \
            -b nucleo_h743zi \
            "$MODULE_PATH/samples/pqcp_bench_protocol" \
            -- \
            -DZEPHYR_EXTRA_MODULES="$MODULE_PATH" \
            -DOVERLAY_CONFIG=overlay-rtos-metrics.conf \
            -DCONFIG_PQCP_MLKEM_LEVEL_512=y \
            -DCONFIG_PQCP_MLKEM_LEVEL_768=n \
            -DCONFIG_PQCP_MLKEM_LEVEL_1024=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_44=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_65=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_87=y \
            -DCONFIG_MAIN_STACK_SIZE=196608 \
            >"$mcu_logs/mlkem512_mldsa87.log" 2>&1

          cp "$RUNNER_TEMP/release-build-nucleo-default/zephyr/zephyr.elf" \
            "$mcu_dir/pqcp_bench_protocol-nucleo_h743zi-mlkem768_mldsa65.elf"
          cp "$RUNNER_TEMP/release-build-nucleo-single-level/zephyr/zephyr.elf" \
            "$mcu_dir/pqcp_bench_protocol-nucleo_h743zi-mlkem512_mldsa87.elf"

          size "$mcu_dir"/pqcp_bench_protocol-*.elf \
            | tee "$mcu_dir/pqcp_bench_protocol-nucleo_h743zi.size.txt"

          ( cd "$mcu_dir" && sha256sum pqcp_bench_protocol-*.elf ) \
            > "$mcu_dir/pqcp_bench_protocol-nucleo_h743zi.sha256"

          echo "MCU_ASSETS_DIR=$mcu_dir" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          python "$MODULE_PATH/scripts/extract_changelog_section.py" \
            --file "$MODULE_PATH/CHANGELOG.md" \
            --section "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload release artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_REF }}
          path: |
            ${{ runner.temp }}/release-check.log
            ${{ runner.temp }}/release-check-output/release_check_results.xml
            ${{ runner.temp }}/build_summary.txt
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-build-logs
            ${{ runner.temp }}/release-mcu-logs
            ${{ runner.temp }}/release-mcu-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          name: ${{ env.RELEASE_REF }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/release-check-output/release_check_results.xml
            ${{ runner.temp }}/build_summary.txt
            ${{ runner.temp }}/release-mcu-assets/pqcp_bench_protocol-nucleo_h743zi-mlkem768_mldsa65.elf
            ${{ runner.temp }}/release-mcu-assets/pqcp_bench_protocol-nucleo_h743zi-mlkem512_mldsa87.elf
            ${{ runner.temp }}/release-mcu-assets/pqcp_bench_protocol-nucleo_h743zi.size.txt
            ${{ runner.temp }}/release-mcu-assets/pqcp_bench_protocol-nucleo_h743zi.sha256
