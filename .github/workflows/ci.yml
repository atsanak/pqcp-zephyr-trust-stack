name: CI

on:
  push:
  pull_request:

jobs:
  qemu-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out module repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Run qemu_x86_64 validation builds
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          west build -p always -d build-ztest-rng -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_rng" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-rng -t run

          west build -p always -d build-ztest-primitive -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_primitive" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-primitive -t run

          west build -p always -d build-ztest-acvp -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_acvp_serial" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-acvp -t run

          west build -p always -d build-ztest-tls -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_tls_selftest" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-tls -t run

          west build -p always -d build-basic-kem -b qemu_x86_64 "$GITHUB_WORKSPACE/samples/pqcp_basic_kem" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-basic-kem -t run

          west build -p always -d build-basic-sig -b qemu_x86_64 "$GITHUB_WORKSPACE/samples/pqcp_basic_sig" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-basic-sig -t run

          west build -p always -d build-protocol-bench -b qemu_x86_64 "$GITHUB_WORKSPACE/samples/pqcp_bench_protocol" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-protocol-bench -t run
