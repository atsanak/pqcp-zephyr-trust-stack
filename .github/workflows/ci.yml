name: CI

on:
  push:
  pull_request:

jobs:
  qemu-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out module repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Check Python tooling
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python -m py_compile \
            "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            "$GITHUB_WORKSPACE/scripts/parse_logs.py"
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" --help > /dev/null

      - name: Run qemu_x86_64 tests
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          set -euo pipefail
          west build -p always -d build-ztest-rng -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_rng" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-rng -t run

          west build -p always -d build-ztest-primitive -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_primitive" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-primitive -t run

          west build -p always -d build-ztest-acvp -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_acvp_serial" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-acvp -t run

          west build -p always -d build-ztest-tls -b qemu_x86_64 "$GITHUB_WORKSPACE/tests/ztest_tls_selftest" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"
          west build -d build-ztest-tls -t run

      - name: Run qemu_x86_64 sample smoke tests
        shell: bash
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          set -euo pipefail

          cleanup_qemu() {
            local build_dir="$1"
            if [[ -f "$build_dir/qemu.pid" ]]; then
              local pid
              pid="$(cat "$build_dir/qemu.pid" || true)"
              if [[ -n "$pid" ]]; then
                kill "$pid" 2>/dev/null || true
              fi
              rm -f "$build_dir/qemu.pid"
            fi
          }

          run_sample() {
            local app="$1"
            local build_dir="$2"
            local metric="$3"
            local log_file="$RUNNER_TEMP/${build_dir}.log"
            local status=0

            west build -p always -d "$build_dir" -b qemu_x86_64 "$GITHUB_WORKSPACE/$app" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"

            cleanup_qemu "$build_dir"
            timeout 45s west build -d "$build_dir" -t run >"$log_file" 2>&1 || status=$?
            cleanup_qemu "$build_dir"

            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              cat "$log_file"
              exit "$status"
            fi

            if ! grep -q "$metric" "$log_file"; then
              cat "$log_file"
              exit 1
            fi
          }

          run_sample "samples/pqcp_basic_kem" "build-basic-kem" "PQCP_METRIC,primitive,keygen,MLKEM,"
          run_sample "samples/pqcp_basic_sig" "build-basic-sig" "PQCP_METRIC,primitive,keygen,MLDSA,"
