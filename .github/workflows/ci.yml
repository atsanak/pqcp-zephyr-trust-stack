name: CI

on:
  push:
  pull_request:

jobs:
  qemu-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Check Python tooling
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python -m py_compile \
            "$GITHUB_WORKSPACE/scripts/extract_changelog_section.py" \
            "$GITHUB_WORKSPACE/scripts/run_acvp_serial_session.py" \
            "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            "$GITHUB_WORKSPACE/scripts/parse_logs.py" \
            "$GITHUB_WORKSPACE/scripts/summarize_cost_of_assurance.py" \
            "$GITHUB_WORKSPACE/scripts/verify_kat_provenance.py" \
            "$GITHUB_WORKSPACE/scripts/run_extended_checks.py" \
            "$GITHUB_WORKSPACE/scripts/run_sanitizer_checks.py" \
            "$GITHUB_WORKSPACE/scripts/release_check.py"
          python "$GITHUB_WORKSPACE/scripts/run_acvp_serial_session.py" --self-test > /dev/null
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" --help > /dev/null

      - name: Run qemu_x86_64 tests
        shell: bash
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          set -euo pipefail

          cleanup_qemu() {
            local build_dir="$1"
            if [[ -f "$build_dir/qemu.pid" ]]; then
              local pid
              pid="$(cat "$build_dir/qemu.pid" || true)"
              if [[ -n "$pid" ]]; then
                kill "$pid" 2>/dev/null || true
              fi
              rm -f "$build_dir/qemu.pid"
            fi
          }

          run_test() {
            local app="$1"
            local build_dir="$2"
            local extra_cmake_args="${3:-}"
            local log_file="$RUNNER_TEMP/${build_dir}.log"
            local status=0

            west build -p always -d "$build_dir" -b qemu_x86_64 "$GITHUB_WORKSPACE/$app" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE" $extra_cmake_args

            cleanup_qemu "$build_dir"
            timeout 120s west build -d "$build_dir" -t run >"$log_file" 2>&1 || status=$?
            cleanup_qemu "$build_dir"

            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              cat "$log_file"
              exit "$status"
            fi

            if ! grep -q "PROJECT EXECUTION SUCCESSFUL" "$log_file"; then
              cat "$log_file"
              exit 1
            fi
          }

          run_test "tests/ztest_rng" "build-ztest-rng"
          run_test "tests/ztest_primitive" "build-ztest-primitive"
          run_test "tests/ztest_acvp_serial" "build-ztest-acvp"
          run_test "tests/ztest_tls_selftest" "build-ztest-tls"
          run_test "tests/ztest_acvp_kat" "build-ztest-acvp-kat-smoke" "-DOVERLAY_CONFIG=overlay-smoke.conf"

      - name: Run qemu_x86_64 sample smoke tests
        shell: bash
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          set -euo pipefail

          cleanup_qemu() {
            local build_dir="$1"
            if [[ -f "$build_dir/qemu.pid" ]]; then
              local pid
              pid="$(cat "$build_dir/qemu.pid" || true)"
              if [[ -n "$pid" ]]; then
                kill "$pid" 2>/dev/null || true
              fi
              rm -f "$build_dir/qemu.pid"
            fi
          }

          run_sample() {
            local app="$1"
            local build_dir="$2"
            local metric="$3"
            local log_file="$RUNNER_TEMP/${build_dir}.log"
            local status=0

            west build -p always -d "$build_dir" -b qemu_x86_64 "$GITHUB_WORKSPACE/$app" -- -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE"

            cleanup_qemu "$build_dir"
            timeout 45s west build -d "$build_dir" -t run >"$log_file" 2>&1 || status=$?
            cleanup_qemu "$build_dir"

            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              cat "$log_file"
              exit "$status"
            fi

            if ! grep -q "$metric" "$log_file"; then
              cat "$log_file"
              exit 1
            fi
          }

          run_sample "samples/pqcp_basic_kem" "build-basic-kem" "PQCP_METRIC,primitive,keygen,MLKEM,"
          run_sample "samples/pqcp_basic_sig" "build-basic-sig" "PQCP_METRIC,primitive,keygen,MLDSA,"

      - name: Run benchmark runner mini-matrix smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            --benchmark-matrix \
            --board qemu_x86_64 \
            --profile MCU_MINIMAL \
            --sample pqcp_basic_kem \
            --timeout 60 \
            --output "$RUNNER_TEMP/benchmark-matrix-smoke" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

      - name: Run profile-validation build smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_benchmarks.py" \
            --profile-validation \
            --board qemu_x86_64 \
            --profile MCU_MINIMAL \
            --sample ztest_rng \
            --build-only \
            --resource-budgets "$GITHUB_WORKSPACE/scripts/resource_budgets.json" \
            --output "$RUNNER_TEMP/profile-validation-smoke" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

  twister-discover:
    runs-on: ubuntu-22.04
    needs:
      - qemu-smoke

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Set up Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Run Twister discovery (build-only, no flash)
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        run: |
          west twister \
            -T "$GITHUB_WORKSPACE/tests" \
            -p qemu_x86_64 \
            --build-only \
            --no-clean \
            -x=ZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            --outdir "$RUNNER_TEMP/twister-out"

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: ${{ runner.temp }}/twister-out/

  nucleo-protocol-builds:
    runs-on: ubuntu-22.04
    needs:
      - qemu-smoke

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cppcheck \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Set up Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Build nucleo_h743zi protocol suite samples
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail

          logs_dir="$RUNNER_TEMP/nucleo-protocol-logs"
          artifacts_dir="$RUNNER_TEMP/nucleo-protocol-artifacts"
          mkdir -p "$logs_dir"
          mkdir -p "$artifacts_dir"

          west build -p always \
            -d "$RUNNER_TEMP/build-nucleo-protocol-default" \
            -b nucleo_h743zi \
            "$GITHUB_WORKSPACE/samples/pqcp_bench_protocol" \
            -- \
            -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DOVERLAY_CONFIG=overlay-rtos-metrics.conf \
            >"$logs_dir/mlkem768_mldsa65.log" 2>&1

          west build -p always \
            -d "$RUNNER_TEMP/build-nucleo-protocol-single-level" \
            -b nucleo_h743zi \
            "$GITHUB_WORKSPACE/samples/pqcp_bench_protocol" \
            -- \
            -DZEPHYR_EXTRA_MODULES="$GITHUB_WORKSPACE" \
            -DOVERLAY_CONFIG=overlay-rtos-metrics.conf \
            -DCONFIG_PQCP_MLKEM_LEVEL_512=y \
            -DCONFIG_PQCP_MLKEM_LEVEL_768=n \
            -DCONFIG_PQCP_MLKEM_LEVEL_1024=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_44=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_65=n \
            -DCONFIG_PQCP_MLDSA_LEVEL_87=y \
            -DCONFIG_MAIN_STACK_SIZE=196608 \
            >"$logs_dir/mlkem512_mldsa87.log" 2>&1

          size "$RUNNER_TEMP/build-nucleo-protocol-default/zephyr/zephyr.elf" \
            | tee "$logs_dir/mlkem768_mldsa65.size.txt"
          size "$RUNNER_TEMP/build-nucleo-protocol-single-level/zephyr/zephyr.elf" \
            | tee "$logs_dir/mlkem512_mldsa87.size.txt"

          cp "$RUNNER_TEMP/build-nucleo-protocol-default/zephyr/zephyr.elf" \
            "$artifacts_dir/mlkem768_mldsa65.elf"
          cp "$RUNNER_TEMP/build-nucleo-protocol-single-level/zephyr/zephyr.elf" \
            "$artifacts_dir/mlkem512_mldsa87.elf"

      - name: Upload nucleo protocol build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-protocol-builds
          path: |
            ${{ runner.temp }}/nucleo-protocol-logs/
            ${{ runner.temp }}/nucleo-protocol-artifacts/

  benchmark-smoke:
    # Reference benchmark data for every CI run. Depends on qemu-smoke so
    # that a broken build short-circuits before we waste cycles running
    # the matrix. Does NOT block the release-gate: the CSV and provenance
    # sidecar are uploaded as artifacts for humans to inspect, but the
    # authoritative benchmark export lives inside release_check.py, which
    # runs its own export_results.py invocation against the full matrix.
    runs-on: ubuntu-22.04
    needs:
      - qemu-smoke

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Set up Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Export benchmark smoke CSV + provenance
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          python "$GITHUB_WORKSPACE/scripts/export_results.py" \
            --platform qemu_x86_64 \
            --smoke \
            --output "$GITHUB_WORKSPACE/results/benchmark_smoke.csv" \
            --provenance-output "$GITHUB_WORKSPACE/results/benchmark_provenance.json" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE"

      - name: Verify CSV + provenance sidecar
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/export_results.py" \
            --validate-only "$GITHUB_WORKSPACE/results/benchmark_smoke.csv" \
            --verify-provenance

      - name: Upload benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ github.run_id }}
          path: |
            results/benchmark_smoke.csv
            results/benchmark_provenance.json
          if-no-files-found: warn

  release-gate:
    # Blocking on main-branch pushes, PRs targeting main, and tag pushes.
    # Do NOT re-add continue-on-error here: that would downgrade the gate to
    # advisory and let broken release_check.py runs merge silently.
    # benchmark-smoke is intentionally NOT in this needs: list — it is
    # informational CI evidence, not a release-gate step (release_check.py
    # runs its own export_results.py on the full matrix).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cppcheck \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 zephyrproject
          cd zephyrproject
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"

      - name: Run release gate (release_check.py)
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -o pipefail
          python "$GITHUB_WORKSPACE/scripts/release_check.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$GITHUB_WORKSPACE" \
            --output-root "$RUNNER_TEMP/release-check-output" \
            | tee "$RUNNER_TEMP/release-check.log"

      - name: Publish release gate JUnit
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ${{ runner.temp }}/release-check-output/release_check_results.xml
          require_tests: true
          fail_on_failure: false
          detailed_summary: true
          check_name: Release Gate JUnit

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-check.log
            ${{ runner.temp }}/release-check-output/release_check_results.xml
            ${{ runner.temp }}/release-check-output
