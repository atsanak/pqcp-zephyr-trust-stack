name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Branch, tag, or commit to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  release-dry-run:
    runs-on: ubuntu-22.04
    env:
      RELEASE_REF: ${{ github.event.inputs.release_ref || 'main' }}
      ZEPHYR_SDK_VERSION: "1.0.1"

    steps:
      - name: Check out module repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Determine release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^#define[[:space:]]\+PQCP_ZEPHYR_VERSION_STRING[[:space:]]\+"\([^"]\+\)".*/\1/p' include/pqcp_zephyr/version.h | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine PQCP_ZEPHYR_VERSION_STRING"
            exit 1
          fi
          if ! grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
            echo "No CHANGELOG entry for ${VERSION}"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cppcheck \
            device-tree-compiler \
            dfu-util \
            file \
            gcc \
            g++ \
            gperf \
            libmagic1 \
            libsdl2-dev \
            make \
            ninja-build \
            qemu-system-x86 \
            wget \
            xz-utils

      - name: Install west
        run: python -m pip install --upgrade west

      - name: Initialize Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          west init -m "$GITHUB_WORKSPACE" --mr "$RELEASE_REF" release-workspace
          cd release-workspace
          west update
          west packages pip --install --ignore-venv-check
          west sdk install --version "$ZEPHYR_SDK_VERSION" --gnu-toolchains x86_64-zephyr-elf arm-zephyr-eabi
          echo "ZEPHYR_WORKSPACE=$PWD" >> "$GITHUB_ENV"
          echo "MODULE_PATH=$PWD/pqcp-zephyr-trust-stack" >> "$GITHUB_ENV"

      - name: Run release gate
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        timeout-minutes: 8
        run: |
          set -o pipefail
          python "$MODULE_PATH/scripts/release_check.py" \
            --ci-fast \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$MODULE_PATH" \
            --output-root "$RUNNER_TEMP/release-check-output" \
            | tee "$RUNNER_TEMP/release-check.log"

      - name: Sanitizer smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python "$MODULE_PATH/scripts/run_sanitizer_checks.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$MODULE_PATH"

      - name: Benchmark CSV smoke
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        timeout-minutes: 20
        env:
          BENCHMARK_SMOKE_CSV: ${{ runner.temp }}/benchmark_smoke.csv
        run: |
          set -euo pipefail
          python "$MODULE_PATH/scripts/export_results.py" \
            --west-root "$ZEPHYR_WORKSPACE" \
            --module-path "$MODULE_PATH" \
            --platform qemu_x86_64 \
            --smoke \
            --output "$BENCHMARK_SMOKE_CSV"

      - name: Validate benchmark CSV (with provenance)
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail
          python "$MODULE_PATH/scripts/export_results.py" \
            --validate-only "$RUNNER_TEMP/benchmark_smoke.csv" \
            --verify-provenance

      - name: Upload benchmark smoke artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/benchmark_smoke.csv
            ${{ runner.temp }}/benchmark_provenance.json

      - name: Build all qemu_x86_64 samples and ztests
        working-directory: ${{ env.ZEPHYR_WORKSPACE }}
        shell: bash
        run: |
          set -euo pipefail

          logs_dir="$RUNNER_TEMP/release-build-logs"
          summary="$RUNNER_TEMP/build_summary.txt"
          mkdir -p "$logs_dir"
          : > "$summary"

          # Keep this list in sync with release.yml so the two workflows
          # exercise identical build matrices.
          apps=(
            "samples/pqcp_basic_kem"
            "samples/pqcp_basic_sig"
            "samples/pqcp_bench_protocol"
            "samples/pqcp_kat_deterministic"
            "samples/pqcp_serial_acvp"
            "samples/pqcp_streaming_hash_mldsa"
            "samples/pqcp_tls_mbedtls_psa"
            "tests/ztest_acvp_kat"
            "tests/ztest_acvp_serial"
            "tests/ztest_primitive"
            "tests/ztest_rng"
            "tests/ztest_tls_selftest"
          )

          for app in "${apps[@]}"; do
            name="${app//\//_}"
            build_dir="$RUNNER_TEMP/build-${name}"
            log_file="$logs_dir/${name}.log"

            echo "==> Building $app" | tee -a "$summary"
            west build -p always -d "$build_dir" -b qemu_x86_64 "$MODULE_PATH/$app" \
              -- -DZEPHYR_EXTRA_MODULES="$MODULE_PATH" >"$log_file" 2>&1
            echo "PASS $app" | tee -a "$summary"
            echo "  log: $log_file" >> "$summary"
          done

      - name: Extract release notes
        run: |
          python "$MODULE_PATH/scripts/extract_changelog_section.py" \
            --file "$MODULE_PATH/CHANGELOG.md" \
            --section "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload dry-run artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.RELEASE_REF }}
          path: |
            ${{ runner.temp }}/release-check.log
            ${{ runner.temp }}/release-check-output/release_check_results.xml
            ${{ runner.temp }}/benchmark_smoke.csv
            ${{ runner.temp }}/build_summary.txt
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-build-logs
